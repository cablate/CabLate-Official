name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build with content and analytics validation
        run: npm run build

      - name: Validate built output
        run: |
          node scripts/validate-entry-surfaces.mjs
          npm run validate:service-application
